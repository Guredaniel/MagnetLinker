[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magnetlinker"
version = "1.3.0"
description = "A desktop qBittorrent companion for routing magnet links."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=5.0",
    "pyperclip>=1.8.1",
    "pystray>=0.19.5",
    "cryptography>=42.0.0",
    "requests>=2.31.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0.0"]
macos = [
    "rumps>=0.3.0",
    "pyobjc-framework-Cocoa>=9.2",
    "pyobjc>=10.0",
]
test = ["pytest>=8.0.0"]

[project.scripts]
magnetlinker = "magnetlinker.MagnetApp:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
magnetlinker = ["assets/*.icns", "assets/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
